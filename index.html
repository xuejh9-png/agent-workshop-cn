<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Studio · 任务工作空间</title>
<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --canvas:#F8F8F7;
  --surface:#FFFFFF;
  --subtle:#EFEFEC;
  --border:#E4E4E0;
  --border-strong:#D6D6D1;
  --text:#202124;
  --text-2:#6E6E69;
  --text-3:#72726D;
  --accent:#7965D8;
  --accent-hover:#6853CC;
  --accent-soft:#F2EFFC;
  --accent-border:#DCD4F7;
  --ok:#3C8C67;
  --ok-soft:#EAF4EE;
  --warn:#A96A12;
  --warn-soft:#FBF1E1;
  --err:#BF4438;
  --err-soft:#FBECEA;
  --shadow-pop:0 8px 28px rgba(32,33,36,.10),0 2px 6px rgba(32,33,36,.05);
  --shadow-drawer:-12px 0 40px rgba(32,33,36,.07);
  --radius:12px;
  --radius-sm:8px;
}

[data-theme="dark"]{
  --canvas:#17181B;
  --surface:#1E1F23;
  --subtle:#26272C;
  --border:#2F3036;
  --border-strong:#3C3D44;
  --text:#F2F2F2;
  --text-2:#A5A6AB;
  --text-3:#9A9BA2;
  --accent:#9C8BE8;
  --accent-hover:#B0A2EE;
  --accent-soft:#282338;
  --accent-border:#3E3559;
  --ok:#5CAF86;
  --ok-soft:#1D2C25;
  --warn:#D2A052;
  --warn-soft:#2E2619;
  --err:#E07A70;
  --err-soft:#31211F;
  --shadow-pop:0 8px 28px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --shadow-drawer:-12px 0 40px rgba(0,0,0,.45);
}

html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;
  line-height:1.65;
  color:var(--text);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  font-variant-numeric:tabular-nums;
}

button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
textarea{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block;flex-shrink:0}
::selection{background:var(--accent-soft);color:var(--text)}

/* ─────────── shell ─────────── */
.app{display:flex;height:100vh;height:100dvh}

/* ─────────── sidebar ─────────── */
.sidebar{
  width:248px;flex-shrink:0;
  background:var(--canvas);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:width .18s ease;
  overflow:hidden;
}
.sidebar.collapsed{width:0;border-right-color:transparent}

.sb-top{padding:14px 12px 6px;display:flex;align-items:center;gap:8px}
.sb-brand{
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;
  color:var(--text);flex:1;white-space:nowrap;padding-left:4px;
}
.sb-brand span{color:var(--text-3);font-weight:400}

.sb-ws{
  margin:6px 8px 2px;padding:7px 10px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:8px;
  cursor:pointer;transition:background .12s;
  white-space:nowrap;
}
.sb-ws:hover{background:var(--subtle)}
.sb-ws-face{
  width:20px;height:20px;border-radius:5px;flex-shrink:0;
  background:var(--text);color:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;
}
.sb-ws-name{font-size:13.5px;font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis}

.sb-new{
  margin:2px 8px 10px;padding:6px 10px;
  border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--text-2);
  cursor:pointer;transition:background .12s,color .12s;
  white-space:nowrap;
}
.sb-new:hover{background:var(--subtle);color:var(--text)}

.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px}

.sb-label{
  font-size:11.5px;font-weight:500;color:var(--text-3);
  padding:14px 10px 4px;white-space:nowrap;
  display:flex;align-items:center;justify-content:space-between;
}
.sb-label button{font-size:11px;color:var(--text-3);padding:0 2px}
.sb-label button:hover{color:var(--text-2)}

.sb-item{
  padding:6px 10px;border-radius:var(--radius-sm);
  display:flex;align-items:center;gap:9px;
  font-size:13px;color:var(--text-2);
  cursor:pointer;transition:background .12s,color .12s;
  white-space:nowrap;position:relative;
}
.sb-item:hover{background:var(--subtle);color:var(--text)}
.sb-item.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(32,33,36,.05)}
.sb-item .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.sb-item .s{font-size:11.5px;color:var(--text-3);flex-shrink:0}

.sb-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;
  background:var(--accent);
}
.sb-dot.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.sb-foot{
  border-top:1px solid var(--border);
  padding:8px 8px 10px;
}
.sb-foot .sb-item{padding:6px 10px}
.sb-user{
  margin-top:6px;padding:6px 10px;
  display:flex;align-items:center;gap:8px;
  border-radius:var(--radius-sm);cursor:pointer;
  white-space:nowrap;
}
.sb-user:hover{background:var(--subtle)}
.sb-user-face{
  width:22px;height:22px;border-radius:50%;
  background:var(--text);color:var(--surface);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;flex-shrink:0;
}
.sb-user-name{font-size:12.5px;color:var(--text-2)}

/* ─────────── main ─────────── */
.main{flex:1;display:flex;flex-direction:column;background:var(--surface);min-width:0;position:relative}

.topbar{
  height:52px;flex-shrink:0;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
  padding:0 20px;
}
.topbar-title{font-size:14px;font-weight:600;letter-spacing:-.005em}
.topbar-sub{font-size:12.5px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.top-spacer{flex:1}

.iconbtn{
  width:30px;height:30px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-2);transition:background .12s,color .12s;
}
.iconbtn:hover{background:var(--subtle);color:var(--text)}
.iconbtn.on{background:var(--subtle);color:var(--text)}
.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ─────────── scroll area ─────────── */
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:780px;margin:0 auto;padding:26px 24px 8px}

.turn{display:flex;gap:12px;margin-bottom:28px}
.turn-av{
  width:26px;height:26px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:600;margin-top:1px;
}
.turn-av.coord{background:var(--accent);color:#fff}
.turn-av.me{background:var(--subtle);color:var(--text-2)}
.turn-body{flex:1;min-width:0}
.turn-head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.turn-name{font-size:13px;font-weight:600}
.turn-time{font-size:11.5px;color:var(--text-3)}
.turn-text{font-size:14.5px;line-height:1.72;color:var(--text)}
.turn-text p+p{margin-top:9px}
.turn-text .em{color:var(--text);font-weight:500}
.turn.me .turn-text{color:var(--text-2)}

/* ─────────── run card ─────────── */
.run{
  margin-top:14px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--surface);
  overflow:hidden;
}
.run-head{
  padding:11px 14px;
  display:flex;align-items:center;gap:9px;
  border-bottom:1px solid var(--border);
  background:var(--canvas);
}
.run-state{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:var(--accent);
}
.run-state.pulse{animation:pulse 1.8s ease-in-out infinite}
.run-state.ok{background:var(--ok)}
.run-state.err{background:var(--err)}
.run-title{font-size:13px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-host{font-size:11.5px;color:var(--text-3);white-space:nowrap;display:flex;align-items:center;gap:4px}
.run-chev{color:var(--text-3)}

.run-steps{list-style:none;padding:8px 14px 10px}
.run-step{
  position:relative;
  display:flex;align-items:flex-start;gap:10px;
  padding:5px 0 5px 0;
  font-size:13px;color:var(--text-2);
}
.run-step .node{
  width:13px;height:13px;flex-shrink:0;margin-top:3px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);
}
.run-step.done{color:var(--text-2)}
.run-step.done .node{color:var(--ok)}
.run-step.now{color:var(--text);font-weight:500}
.run-step.now .node{color:var(--accent)}
.run-step .step-note{font-size:11.5px;color:var(--text-3);font-weight:400;margin-left:6px}
.run-step .spin{animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.run-foot{
  padding:8px 14px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  font-size:11.5px;color:var(--text-3);
  background:var(--canvas);
}
.run-link{
  color:var(--text-2);font-size:11.5px;
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 0;transition:color .12s;
}
.run-link:hover{color:var(--accent)}

/* ─────────── inline cards (approval / review / file) ─────────── */
.card{
  margin-top:14px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
}
.card-head{
  padding:10px 14px;
  display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);
  background:var(--canvas);
}
.card-title{font-size:12.5px;font-weight:600;flex:1}
.card-body{padding:12px 14px;font-size:13px;color:var(--text-2);line-height:1.7}
.card-acts{
  padding:10px 14px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
  background:var(--canvas);
}
.card-acts .spacer{flex:1}

.pill{
  font-size:11px;font-weight:500;
  padding:2px 8px;border-radius:20px;
  display:inline-flex;align-items:center;gap:4px;
  white-space:nowrap;
}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.err{background:var(--err-soft);color:var(--err)}
.pill.run{background:var(--accent-soft);color:var(--accent)}

.btn{
  height:30px;padding:0 12px;border-radius:var(--radius-sm);
  font-size:12.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:6px;
  transition:background .12s,color .12s,border-color .12s,opacity .12s;
  border:1px solid transparent;
  white-space:nowrap;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{color:var(--text-2);border-color:var(--border)}
.btn-ghost:hover{background:var(--subtle);color:var(--text);border-color:var(--border-strong)}
.btn-quiet{color:var(--text-3)}
.btn-quiet:hover{color:var(--text-2);background:var(--subtle)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-sm{height:26px;font-size:12px;padding:0 10px}

.kv{display:grid;grid-template-columns:78px 1fr;gap:5px 10px;font-size:12.5px}
.kv dt{color:var(--text-3)}
.kv dd{color:var(--text-2)}

.filerow{
  display:flex;align-items:center;gap:9px;
  padding:9px 14px;
  border-top:1px solid var(--border);
  font-size:12.5px;
  cursor:pointer;transition:background .12s;
}
.filerow:hover{background:var(--canvas)}
.filerow .fname{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .fmeta{color:var(--text-3);font-size:11.5px}

/* ─────────── composer ─────────── */
.composer-wrap{
  flex-shrink:0;
  padding:12px 24px 16px;
  background:var(--surface);
  position:relative;
}
.composer{
  max-width:780px;margin:0 auto;
  border:1px solid var(--border-strong);
  border-radius:14px;
  background:var(--surface);
  transition:border-color .15s,box-shadow .15s;
  position:relative;
}
.composer:focus-within{
  border-color:var(--accent-border);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.composer.running{border-color:var(--accent-border)}

.composer-field{
  display:flex;align-items:flex-end;gap:8px;
  padding:11px 12px 4px 14px;
}
.composer-field textarea{
  flex:1;border:none;outline:none;background:none;resize:none;
  font-size:14.5px;line-height:1.6;
  min-height:23px;max-height:190px;
  padding:0;
}
.composer-field textarea::placeholder{color:var(--text-3)}

.send{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,opacity .12s,transform .12s;
}
.send:hover{background:var(--accent-hover)}
.send:disabled{background:var(--subtle);color:var(--text-3);cursor:default}
.send.stop{background:var(--text);color:var(--surface)}
.send.stop:hover{opacity:.85}

.composer-bar{
  display:flex;align-items:center;gap:4px;
  padding:4px 8px 7px 10px;
  flex-wrap:wrap;
}

.chip{
  height:26px;padding:0 8px 0 7px;border-radius:7px;
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;color:var(--text-2);
  transition:background .12s,color .12s;
  border:1px solid transparent;
  white-space:nowrap;max-width:280px;
}
.chip:hover{background:var(--subtle);color:var(--text)}
.chip[aria-expanded="true"]{background:var(--subtle);color:var(--text);border-color:var(--border)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip .lbl{color:var(--text-3)}
.chip .val{color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.chip .caret{color:var(--text-3)}
.chip.warn .val{color:var(--warn)}

.bar-sep{width:1px;height:14px;background:var(--border);margin:0 3px}
.bar-spacer{flex:1}
.bar-ico{
  width:26px;height:26px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-3);transition:background .12s,color .12s;
}
.bar-ico:hover{background:var(--subtle);color:var(--text-2)}
.bar-ico:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

.composer-hint{
  max-width:780px;margin:7px auto 0;
  display:flex;justify-content:space-between;
  font-size:11px;color:var(--text-3);
}
.composer-hint kbd{
  font-family:inherit;font-size:10.5px;
  border:1px solid var(--border);border-radius:4px;
  padding:0 4px;color:var(--text-3);
}

/* ─────────── popover ─────────── */
.pop{
  position:absolute;
  bottom:calc(100% + 8px);
  left:0;
  width:340px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow-pop);
  padding:6px;
  z-index:60;
  display:none;
  animation:popIn .12s ease;
}
.pop.open{display:block}
@keyframes popIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

.pop-head{
  padding:6px 8px 8px;
  font-size:11.5px;color:var(--text-3);
  display:flex;align-items:center;justify-content:space-between;
}
.pop-head button{font-size:11.5px;color:var(--text-3);display:inline-flex;align-items:center;gap:4px}
.pop-head button:hover{color:var(--accent)}

.opt{
  display:flex;align-items:flex-start;gap:9px;
  padding:8px 9px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background .1s;
  position:relative;
}
.opt:hover:not(.disabled){background:var(--subtle)}
.opt.disabled{cursor:not-allowed;opacity:.55}
.opt-ico{color:var(--text-2);margin-top:2px}
.opt.disabled .opt-ico{color:var(--text-3)}
.opt-main{flex:1;min-width:0}
.opt-name{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.opt-sub{font-size:11.5px;color:var(--text-3);margin-top:1px;line-height:1.5}
.opt-right{display:flex;align-items:center;gap:5px;margin-top:2px;color:var(--accent)}
.opt-sep{height:1px;background:var(--border);margin:5px 8px}

.badge{
  font-size:10.5px;padding:1px 6px;border-radius:10px;
  font-weight:500;
}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.wait{background:var(--warn-soft);color:var(--warn)}
.badge.err{background:var(--err-soft);color:var(--err)}
.badge.off{background:var(--subtle);color:var(--text-3)}

/* ─────────── drawer ─────────── */
.drawer{
  position:absolute;top:0;right:0;bottom:0;
  width:372px;max-width:88vw;
  background:var(--surface);
  border-left:1px solid var(--border);
  box-shadow:var(--shadow-drawer);
  transform:translateX(100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
  z-index:50;
}
.drawer.open{transform:translateX(0)}
.drawer-head{
  height:52px;flex-shrink:0;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
  padding:0 14px 0 18px;
}
.drawer-title{font-size:13.5px;font-weight:600;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:16px 18px 28px}
.drawer-sec{margin-bottom:22px}
.drawer-sec h4{
  font-size:11.5px;font-weight:500;color:var(--text-3);
  margin-bottom:8px;
}
.drawer-sec .kv{grid-template-columns:88px 1fr}

.log{
  font-size:11.5px;line-height:1.75;
  color:var(--text-2);
  border-left:1px solid var(--border);
  padding-left:12px;
  margin-left:2px;
}
.log div{position:relative;padding:1px 0}
.log div::before{
  content:'';position:absolute;left:-15px;top:9px;
  width:5px;height:5px;border-radius:50%;background:var(--border-strong);
}
.log .t{color:var(--text-3);margin-right:8px}
.log .ok::before{background:var(--ok)}
.log .now::before{background:var(--accent)}

/* ─────────── empty state ─────────── */
.empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px 24px 40px;
}
.empty-inner{width:100%;max-width:640px}
.empty-title{
  font-size:30px;font-weight:600;letter-spacing:-.02em;
  text-align:center;margin-bottom:8px;
}
.empty-sub{
  font-size:14px;color:var(--text-3);text-align:center;margin-bottom:34px;
}
.recent-title{
  font-size:11.5px;color:var(--text-3);
  margin:34px 0 6px;padding-left:2px;
}
.recent-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-sm);
  cursor:pointer;transition:background .12s;
  font-size:13px;
}
.recent-item:hover{background:var(--canvas)}
.recent-item .rname{flex:1;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.recent-item .rmeta{font-size:11.5px;color:var(--text-3)}

/* ─────────── demo tag ─────────── */
.demo-tag{
  position:fixed;right:14px;bottom:12px;
  font-size:10.5px;font-weight:500;letter-spacing:.02em;
  color:var(--warn);background:var(--warn-soft);
  border:1px solid rgba(169,106,18,.16);
  padding:3px 9px;border-radius:20px;
  z-index:200;pointer-events:none;
}
[data-theme="dark"] .demo-tag{border-color:rgba(210,160,82,.2)}

/* ─────────── scrollbar ─────────── */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:transparent;border-radius:5px;border:2px solid transparent;background-clip:content-box}
*:hover::-webkit-scrollbar-thumb{background:var(--border-strong);background-clip:content-box}

/* ─────────── responsive ─────────── */
@media (max-width:1024px){
  .sidebar{width:212px}
  .thread{max-width:100%}
}
@media (max-width:860px){

}

  .empty-title{font-size:23px}
  .pop{width:calc(100vw - 48px);left:-4px}
  .composer-hint{display:none}
  .topbar{padding:0 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}

@media(min-width:861px){.sidebar{position:relative;width:240px;box-shadow:none}#expandBtn{display:none!important}.sidebar.collapsed~.main #expandBtn{display:flex!important}.nav-shade{display:none!important}}

@media(max-width:500px){.topbar-sub{display:none}.topbar{gap:6px}.turn{gap:8px}.turn-av{width:23px;height:23px}.thread{padding:24px 14px 6px}.run-head{flex-wrap:wrap}.run-host{width:100%;padding-left:16px;text-align:left}.composer-bar{padding:4px;gap:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px 36px}.composer-bar .bar-spacer,.composer-bar .bar-sep{display:none}.composer-bar .chip{min-width:0;max-width:100%}.composer-bar .bar-ico{width:36px}.chip{padding:0 5px;max-width:190px;font-size:11px}.chip .lbl{display:inline}.bar-sep{display:none}.composer-wrap{padding:8px 10px 38px}.composer-field{padding:12px 12px 4px}.empty{padding:32px 6px}.empty-title{font-size:25px}.empty-sub{font-size:13px}.demo-tag{left:0;right:0;text-align:center;font-size:10px}.pop{left:0;width:calc(100vw - 22px)}.run-foot{flex-wrap:wrap}.drawer{max-width:100%;width:100%}}

.brand-mark{display:inline-flex;align-items:center;justify-content:center;color:var(--accent)}.brand-mark svg{width:26px;height:26px}.empty-mark{border:0;width:44px;height:44px;background:var(--accent-soft)}.empty-mark svg{width:30px;height:30px}

--accent)}.employee-choice small{display:block;color:var(--text-2);font-size:11px}.employee-choice.disabled{opacity:.55}.empty-sub{margin-bottom:24px}

<body>

<div class="app">
<button class="nav-shade" aria-label="关闭导航" onclick="toggleSidebar()"></button>

  <!-- ══════ SIDEBAR ══════ -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-brand">Agent Studio <span>v0.1</span></div>
      <button class="iconbtn" id="collapseBtn" title="收起侧栏" aria-label="收起侧栏">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg>
      </button>
    </div>

    <div class="sb-new" onclick="newTask()" role="button" tabindex="0">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      新建对话
    </div>

    <div class="sb-scroll"><div class="sb-label">正在读取本机记录…</div></div>

    <div class="sb-foot"><button class="sb-item" style="width:100%" onclick="openSettings()"><span class="t">设置</span></button>
      <div class="sb-user">
        <div class="sb-user-face">h</div>
        <span class="sb-user-name">hao</span>
      </div>
    </div>
  </aside>

  <!-- ══════ MAIN ══════ -->
  <main class="main">

    <header class="topbar">
      <button class="iconbtn" id="expandBtn" title="展开侧栏" aria-label="展开侧栏" style="display:none" onclick="toggleSidebar()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="m14 15 3-3-3-3"/></svg>
      </button>
      <div class="topbar-title" id="taskTitle">工作空间</div>
      <div class="topbar-sub" id="taskSub">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        连接本机服务…
      </div>
      <div class="top-spacer"></div>
      <button class="iconbtn" onclick="toggleTheme()" title="切换主题" aria-label="切换主题" id="themeBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="iconbtn" id="drawerBtn" onclick="toggleDrawer()" title="任务详情" aria-label="任务详情">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>
      </button>
    </header>

    <!-- thread -->
    <div class="scroll" id="scroll">
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer" id="composer">
        <div class="composer-field">
          <textarea aria-label="任务目标" id="ta" rows="1" placeholder="描述任务，选择执行方式，交给协调器完成…" oninput="autoGrow(this);syncSend()" onkeydown="onKey(event)"></textarea>
          <button class="send" id="sendBtn" disabled title="发送" aria-label="发送" onclick="sendOrStop()">
            <svg id="sendIco" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>

        <div class="composer-bar">
          <button class="chip" id="execChip" aria-expanded="false" onclick="togglePop('execPop', event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg>
            <span class="lbl">执行方式</span>
            <span class="val" id="execVal">自动</span>
            <svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          <span class="bar-sep"></span>

          <button class="chip" id="modelChip" aria-expanded="false" onclick="togglePop('modelPop', event)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2"/></svg>
            <span class="lbl">模型</span>
            <span class="val" id="modelVal">自动</span>
            <svg class="caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          <div class="bar-spacer"></div>

          <button class="bar-ico" title="执行策略" aria-label="执行策略" onclick="openStrategy(event)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          </button>
          <button class="bar-ico" title="添加附件" aria-label="添加附件">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
        </div>

        <div class="pop" id="execPop" role="dialog" aria-label="选择执行方式"></div>
        <div class="pop" id="modelPop" role="dialog" aria-label="选择模型"></div>
      </div>

      <div class="composer-hint">
        <span><kbd>Enter</kbd> 发送 &nbsp; <kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</span>
        <span id="hintRight">自动 · 自动模型</span>
      </div>
    </div>

    <!-- ══════ DRAWER ══════ -->
    <aside class="drawer" id="drawer" aria-hidden="true" inert>
      <div class="drawer-head">
        <div class="drawer-title">任务详情</div>
        <button class="iconbtn" onclick="toggleDrawer()" aria-label="关闭">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </aside>

  </main>
</div>

<div class="demo-tag" role="note">本机运行 · 文件限当前工作空间</div>

<dialog id="modal"><div id="modalBody"></div></dialog>
<script src="app.js"></script>
</body>
</html>
